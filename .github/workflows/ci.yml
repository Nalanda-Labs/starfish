name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kernel
        run: uname -r
      - name: Clippy (includes the no-panic lints)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy without the optional features
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Builds for AArch64 (compile check only; nothing is run)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo check --target aarch64-unknown-linux-gnu
      - name: Documentation (no broken links, examples compile)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests
        run: cargo test
      - name: Tests, release
        run: cargo test --release

  miri:
    name: Miri (unsafe code without io_uring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Unit tests under Miri
        run: cargo +nightly miri test --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  fuzz:
    name: Fuzz the allocator (2 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Fuzz
        run: cargo +nightly fuzz run alloc_ops -- -max_total_time=120 -max_len=4096 -len_control=0
